
<div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 fade-in" (click)="closeModal.emit()">
    <div class="glass-panel w-full max-w-sm rounded-3xl p-6 relative" (click)="$event.stopPropagation()">
        <button (click)="closeModal.emit()" class="absolute top-4 right-4 text-slate-500 hover:text-white" [title]="t().common.close">✕</button>
        <h2 class="text-xl font-bold mb-6 text-white">{{ t().report.title }}</h2>
        
        <div class="space-y-4 mb-6">
            <label class="text-xs text-slate-400 font-bold uppercase block">{{ t().report.date_range }}</label>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-xs text-slate-500 mb-1 block">{{ t().report.start_date }}</label>
                    <input type="date" [ngModel]="startDate()" (ngModelChange)="startDate.set($event)" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="text-xs text-slate-500 mb-1 block">{{ t().report.end_date }}</label>
                    <input type="date" [ngModel]="endDate()" (ngModelChange)="endDate.set($event)" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
                </div>
            </div>
        </div>

        <button (click)="generateReport()" [disabled]="isSending()" class="w-full bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-700 text-white font-bold py-3 rounded-xl shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2">
            @if(isSending()) {
                <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                {{ t().report.sending }}
            } @else {
                {{ t().report.generate_btn }}
            }
        </button>
    </div>
</div>
